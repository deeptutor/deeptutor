[project]
name = "deeptutor"
version = "0.0.1"
description = "DeepTutor: Lifelong Personalized Tutoring — agent-native learning companion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DeepTutor Contributors" }]
keywords = ["tutoring", "agent", "learning", "rag", "education"]
dependencies = []

[project.optional-dependencies]
full = []

[project.scripts]
deeptutor = "deeptutor_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
